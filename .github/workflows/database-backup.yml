name: Production database backup

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Back up PostgreSQL to private R2
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MIGRATION_SSH_HOST: ${{ vars.MIGRATION_SSH_HOST }}
          MIGRATION_DB_HOST: ${{ vars.MIGRATION_DB_HOST }}
          MIGRATION_SSH_KEY: ${{ secrets.MIGRATION_SSH_KEY }}
          MIGRATION_SSH_KNOWN_HOSTS: ${{ secrets.MIGRATION_SSH_KNOWN_HOSTS }}
          R2_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: bash scripts/with-production-database.sh pnpm db:backup
