name: Promote release tag to prod

on:
  push:
    tags:
      - "release/v*.*.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-release-to-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use the release/vX.Y.Z format"
            exit 1
          fi

          release_version="${RELEASE_TAG#release/v}"
          package_version="$(node -p "require('./package.json').version")"

          if [ "${release_version}" != "${package_version}" ]; then
            echo "::error::${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Verify the exact release commit passed Quality
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" "origin/$PRIMARY_BRANCH"
          passed="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
            -f head_sha="$release_commit" -f branch="$PRIMARY_BRANCH" -f event=push \
            --jq '.workflow_runs | sort_by(.run_number) | last | .conclusion == "success"')"
          if [ "$passed" != "true" ]; then
            echo "::error::The release commit has not passed Quality on the default branch."
            exit 1
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply release migrations once before promotion
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          JOB_DATABASE_URL: ${{ secrets.PRODUCTION_JOB_DATABASE_URL }}
          MIGRATION_SSH_HOST: ${{ vars.MIGRATION_SSH_HOST }}
          MIGRATION_DB_HOST: ${{ vars.MIGRATION_DB_HOST }}
          MIGRATION_SSH_KEY: ${{ secrets.MIGRATION_SSH_KEY }}
          MIGRATION_SSH_KNOWN_HOSTS: ${{ secrets.MIGRATION_SSH_KNOWN_HOSTS }}
        run: bash scripts/with-production-database.sh pnpm db:migrate

      - name: Promote tagged commit to prod
        env:
          PRIMARY_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch origin \
            "+refs/heads/${PRIMARY_BRANCH}:refs/remotes/origin/${PRIMARY_BRANCH}" \
            --tags \
            --force

          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          printf 'Promoting %s to prod at %s\n' "${RELEASE_TAG}" "${release_commit}"

          if ! git merge-base --is-ancestor \
            "${release_commit}" \
            "refs/remotes/origin/${PRIMARY_BRANCH}"; then
            echo "::error::${RELEASE_TAG} is not reachable from ${PRIMARY_BRANCH}"
            exit 1
          fi

          remote_prod_commit="$(
            git ls-remote --heads origin refs/heads/prod | awk '{print $1}'
          )"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B prod "${release_commit}"

          if [ -n "${remote_prod_commit}" ]; then
            git push origin HEAD:refs/heads/prod \
              --force-with-lease="refs/heads/prod:${remote_prod_commit}"
          else
            git push origin HEAD:refs/heads/prod \
              --force-with-lease="refs/heads/prod:"
          fi
